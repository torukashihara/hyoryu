<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漂流研究室 Drift Laboratory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --white: #f0ece4;
    --dim: rgba(240, 236, 228, 0.7);
    --faint: rgba(240, 236, 228, 0.45);
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    /* cursor: none; */
  }

  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 6px;
    height: 6px;
    background: #111;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s ease;
    mix-blend-mode: difference;
  }

  .cursor-ring {
    position: fixed;
    width: 32px;
    height: 32px;
    border: 1px solid rgba(240, 236, 228, 0.5);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
  }

  /* Background */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .bg-base {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .bg-base iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 177.78vh;
    height: 100vh;
    min-width: 100%;
    min-height: 56.25vw;
    transform: translate(-50%, -50%);
    border: none;
    filter: brightness(0.85) saturate(0.9);
  }

  .bg-base iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 177.78vh;
    height: 100vh;
    min-width: 100%;
    min-height: 56.25vw;
    transform: translate(-50%, -50%);
    border: none;
    filter: brightness(0.85) saturate(0.9);
  }

  .bg-base iframe {
    width: 100%;
    height: 100%;
    border: none;
    object-fit: cover;
  }

  .bg-base video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  @keyframes slowPan {
    0%   { transform: translate(0%, 0%); }
    100% { transform: translate(5%, 5%); }
  }
    100% { transform: translate(-15%, -15%); }
  }

  /* Distant light bleed */
  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 35% 25% at 62% 78%, rgba(180, 140, 80, 0.07) 0%, transparent 70%),
      radial-gradient(ellipse 20% 30% at 15% 55%, rgba(100, 120, 180, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 15% at 50% 95%, rgba(140, 100, 60, 0.05) 0%, transparent 80%);
    animation: glowShift 12s ease-in-out infinite alternate;
  }

  @keyframes glowShift {
    0%   { opacity: 0.7; }
    50%  { opacity: 1; }
    100% { opacity: 0.5; }
  }

  /* Film grain overlay */
  .grain {
    position: absolute;
    inset: -50%;
    width: 200%;
    height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.028;
    animation: grainMove 0.12s steps(1) infinite;
    pointer-events: none;
  }

  @keyframes grainMove {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-3%, -5%); }
    20%  { transform: translate(4%, 2%); }
    30%  { transform: translate(-2%, 6%); }
    40%  { transform: translate(5%, -3%); }
    50%  { transform: translate(-4%, 4%); }
    60%  { transform: translate(3%, -6%); }
    70%  { transform: translate(-5%, 2%); }
    80%  { transform: translate(2%, 5%); }
    90%  { transform: translate(-3%, -2%); }
    100% { transform: translate(4%, -4%); }
  }

  /* Vertical scan line — subtle */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.04) 3px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
  }

  /* Main stage */
  .stage {
    position: relative;
    z-index: 10;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 0 8vw;
  }

  /* Title block */
  .title-block {
    opacity: 0;
    animation: fadeUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .title-ja {
    font-family: 'Noto Serif JP', serif;
    font-weight: 400;
    font-size: clamp(1.2rem, 2.76vw, 2.52rem);
    color: #f0ece4;
    letter-spacing: 0.18em;
    line-height: 1;
    margin-bottom: 0.55em;
  }

  .title-en {
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(0.86rem, 1.73vw, 1.44rem);
    color: rgba(240, 236, 228, 0.7);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    line-height: 1;
  }

  /* Divider line */
  .divider {
    display: none;
  }

  @keyframes lineExpand {
    to { width: clamp(80px, 15vw, 160px); }
  }

  /* Tagline */
  .tagline {
    font-family: 'Noto Serif JP', serif;
    font-weight: 400;
    font-size: clamp(0.78rem, 1.2vw, 1.02rem);
    color: #f0ece4;
    letter-spacing: 0.22em;
    line-height: 2.2;
    margin-top: 1.6em;
    opacity: 0;
    animation: fadeUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
  }

  /* Corner nav */
  .corner-nav {
    position: fixed;
    top: 2.2rem;
    right: 1.2rem;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.7rem;
    opacity: 0;
    animation: fadeIn 1.2s ease 2.4s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .corner-nav a {
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    font-size: 0.84rem;
    color: rgba(240, 236, 228, 0.5);
    letter-spacing: 0.22em;
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.4s ease;
    position: relative;
  }

  .corner-nav a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    right: 0;
    width: 0;
    height: 1px;
    background: #111;
    transition: width 0.4s ease;
  }

  .corner-nav a:hover {
    color: #f0ece4;
  }

  .corner-nav a:hover::after {
    width: 100%;
  }

  /* Bottom left — credit */
  .bottom-credit {
    position: fixed;
    bottom: 2.2rem;
    left: 8vw;
    z-index: 20;
    opacity: 0;
    animation: fadeIn 1.2s ease 2.8s forwards;
  }

  .bottom-credit p {
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    font-size: clamp(0.78rem, 1.2vw, 1.02rem);
    color: #f0ece4;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1.8;
  }

  /* Bottom right — year */
  .bottom-year {
    position: fixed;
    bottom: 2.2rem;
    right: 3rem;
    z-index: 20;
    opacity: 0;
    animation: fadeIn 1.2s ease 2.8s forwards;
  }

  .bottom-year p {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(0.78rem, 1.2vw, 1.02rem);
    color: rgba(240, 236, 228, 0.5);
    letter-spacing: 0.14em;
  }

  /* Floating particle — subtle dot drift */
  .particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: rgba(240, 236, 228, 0.2);
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
  }

</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="bg">
  <div class="bg-base"><iframe src="https://www.youtube.com/embed/jzjxKH7OsTw?autoplay=1&mute=1&loop=1&playlist=jzjxKH7OsTw&controls=0&playsinline=1&rel=0&showinfo=0&modestbranding=1&iv_load_policy=3" allow="autoplay; fullscreen"></iframe></div>
  <div class="bg-glow"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>
</div>

<nav class="corner-nav">
  <a href="#">About</a>
  <a href="#">Projects</a>
  <a href="#">Members</a>
  <a href="#">Contact</a>
</nav>

<main class="stage">
  <div class="title-block">
    <h1 class="title-ja">漂流研究室</h1>
    <p class="title-en">Drift Laboratory</p>
  </div>
  <div class="divider"></div>
  <p class="tagline">
    漂流を研究する。<br>
    研究室から漂流する。
  </p>
</main>

<div class="bottom-credit">
  <p>Direction — 中川優奈</p>
  <p>工学院大学 樫原徹研究室</p>
</div>



<script>
  // Force video play
const vid = document.querySelector('.bg-base video');
if (vid) {
  vid.play().catch(() => {});
  document.addEventListener('click', () => vid.play(), { once: true });
  document.addEventListener('touchstart', () => vid.play(), { once: true });
}

// Custom cursor
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;

  document.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;
    cursor.style.left = mx + 'px';
    cursor.style.top = my + 'px';
  });

  function animRing() {
    rx += (mx - rx) * 0.1;
    ry += (my - ry) * 0.1;
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    requestAnimationFrame(animRing);
  }
  animRing();

  // Hover state for nav links
  document.querySelectorAll('.corner-nav a').forEach(a => {
    a.addEventListener('mouseenter', () => {
      ring.style.width = '48px';
      ring.style.height = '48px';
      ring.style.borderColor = 'rgba(240,236,228,0.3)';
    });
    a.addEventListener('mouseleave', () => {
      ring.style.width = '32px';
      ring.style.height = '32px';
      ring.style.borderColor = 'rgba(240,236,228,0.5)';
    });
  });

  // Floating particles
  function createParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    const x = Math.random() * 100;
    const duration = 18 + Math.random() * 24;
    const delay = Math.random() * 10;
    p.style.left = x + 'vw';
    p.style.bottom = '-4px';
    p.style.opacity = Math.random() * 0.3;
    p.style.animation = `particleDrift ${duration}s linear ${delay}s infinite`;
    document.body.appendChild(p);
  }

  const style = document.createElement('style');
  style.textContent = `
    @keyframes particleDrift {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.2; }
      90%  { opacity: 0.1; }
      100% { transform: translateY(-105vh) translateX(${Math.random() > 0.5 ? '' : '-'}${Math.floor(Math.random()*40)}px); opacity: 0; }
    }
  `;
  document.head.appendChild(style);

  for (let i = 0; i < 18; i++) createParticle();
</script>

<script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
